name: One-shot PrimitiveIntervals distributivity repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-primitive-distributivity.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace tautological distributivity certificate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('LRA/NumberSystems/RealNumbers/Constructions/PrimitiveIntervals/Laws.lean')
          text = path.read_text()
          old = '''  quotient_distributivity rational_model = quotient_distributivity rational_model ∧\n  (∀ value : Carrier rational_model,\n'''
          new = '''  (∀ first second third : Carrier rational_model,\n    multiplication rational_model first\n        (addition rational_model second third) =\n      addition rational_model\n        (multiplication rational_model first second)\n        (multiplication rational_model first third)) ∧\n  (∀ value : Carrier rational_model,\n'''
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 exact occurrences, found {count}')
          text = text.replace(old, new)
          path.write_text(text)
          PY

          if git grep -n 'quotient_distributivity rational_model = quotient_distributivity rational_model' -- LRA/NumberSystems/RealNumbers/Constructions/PrimitiveIntervals/Laws.lean; then
            echo 'Tautological distributivity certificate remains.' >&2
            exit 1
          fi

          rm .github/workflows/one-shot-primitive-distributivity.yml

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoondockTaints'
          git config user.email 'wsollers@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Repair PrimitiveIntervals distributivity certificate'
          git push origin HEAD:main
