name: Lean Repository Documentation and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lra-lean-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build documentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: documentation-build
          tags: lra-lean-docs:latest
          load: true
          cache-from: type=gha,scope=lra-lean-documentation-build
          cache-to: type=gha,scope=lra-lean-documentation-build,mode=max

      - name: Build repository site with Blueprint output
        run: |
          container_name="lra-lean-pages-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker create \
            --name "$container_name" \
            --workdir /workspace \
            lra-lean-docs \
            bash scripts/docker-blueprint-entrypoint.sh docs
          git archive --format=tar HEAD | docker cp - "$container_name:/workspace"
          tar -cf - .git | docker cp - "$container_name:/workspace"
          docker start --attach "$container_name"
          docker cp "$container_name:/workspace/site" ./site
          mkdir -p build
          docker cp "$container_name:/workspace/build/proof-map.json" ./build/proof-map.json

      - name: Validate generated proof map
        run: python3 scripts/check-proof-map.py --data build/proof-map.json --site site

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
