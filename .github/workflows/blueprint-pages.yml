name: Lean Repository Documentation and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: lra-lean-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build documentation image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: documentation-build
          tags: lra-lean-docs:latest
          load: true
          cache-from: type=gha,scope=lra-lean-documentation-build
          cache-to: type=gha,scope=lra-lean-documentation-build,mode=max

      - name: Build Blueprint image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.blueprint
          tags: lra-lean-blueprint:latest
          load: true
          cache-from: type=gha,scope=lra-lean-blueprint-build
          cache-to: type=gha,scope=lra-lean-blueprint-build,mode=max

      - name: Build active Lean libraries
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            lra-lean-docs \
            lake build LRAVolumeI LRAVolumeII LRAVolumeIII LRAVolumeIV LRAVolumeVI LRAVolumeVII LRATests
        # Lean accepts declarations containing `sorry`; placeholders are shown
        # by the generated site and do not fail the ordinary project build.

      - name: Build repository site with Blueprint output
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -w /workspace \
            lra-lean-blueprint \
            docs

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
