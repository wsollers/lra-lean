name: One-shot Mathlib integer model rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-mathlib-integer-name.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rename loose Mathlib integer model
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git grep -Il 'mathlibIntegerModel' -- ':!*.lock' ':!lake-manifest.json' || true)
          if ((${#files[@]})); then
            sed -i 's/mathlibIntegerModel/mathlibDiscretelyOrderedIntegralDomainModel/g' "${files[@]}"
          fi
          if git grep -n 'mathlibIntegerModel' -- ':!*.lock' ':!lake-manifest.json'; then
            exit 1
          fi
          rm .github/workflows/one-shot-mathlib-integer-name.yml
      - name: Commit rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoondockTaints'
          git config user.email 'wsollers@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Name Mathlib integer structural model accurately'
          git push origin HEAD:main
