name: One-shot IntegerModel rename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rename-integer-model.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rename standalone generic integer model tokens
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, re, subprocess
          files = subprocess.check_output(
              ['git', 'grep', '-Il', 'IntegerModel', '--', ':!*.lock', ':!lake-manifest.json'],
              text=True,
          ).splitlines()
          pattern = re.compile(r'\bIntegerModel\b')
          for name in files:
              path = pathlib.Path(name)
              text = path.read_text()
              new = pattern.sub('DiscretelyOrderedIntegralDomainModel', text)
              if new != text:
                  path.write_text(new)
          PY

          if git grep -n -P '\bIntegerModel\b' -- ':!*.lock' ':!lake-manifest.json'; then
            echo 'Standalone IntegerModel references remain after rename.' >&2
            exit 1
          fi

          rm .github/workflows/one-shot-rename-integer-model.yml

      - name: Commit clean rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoondockTaints'
          git config user.email 'wsollers@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Rename generic integer model structurally'
          git push origin HEAD:main
