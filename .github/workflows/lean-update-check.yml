name: Weekly Lean Update Check

on:
  schedule:
    # Saturdays at 10:00 UTC.
    - cron: '0 10 * * 6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-lean-update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check latest Lean release
    runs-on: ubuntu-latest

    env:
      NOTIFY_HANDLE: ${{ vars.LEAN_UPDATE_NOTIFY_HANDLE || github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Lean versions
        id: versions
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const { data: release } = await github.rest.repos.getLatestRelease({
              owner: "leanprover-community",
              repo: "mathlib4",
            });

            const latest = release.tag_name;
            if (!/^v\d+\.\d+\.\d+$/.test(latest)) {
              throw new Error(`Unexpected mathlib4 release tag: ${latest}`);
            }

            const toolchain = fs.readFileSync("lean-toolchain", "utf8").trim();
            const pinnedMatch = toolchain.match(/^leanprover\/lean4:(v\d+\.\d+\.\d+)$/);
            if (!pinnedMatch) {
              throw new Error(`Unexpected lean-toolchain pin: ${toolchain}`);
            }

            const pinned = pinnedMatch[1];
            const display = latest.replace(/^v/, "");
            const branch = `checking-update-to-lean-${display}`;

            core.setOutput("latest", latest);
            core.setOutput("latest_display", display);
            core.setOutput("pinned", pinned);
            core.setOutput("branch", branch);
            core.setOutput("update_needed", String(latest !== pinned));

      - name: Stop when already current
        if: steps.versions.outputs.update_needed != 'true'
        run: |
          echo "Pinned Lean version ${{ steps.versions.outputs.pinned }} is current."

      - name: Configure Git author
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Prepare update branch
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          branch="${{ steps.versions.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
          else
            git checkout -B "$branch"
          fi

      - name: Bump Lean and mathlib pins
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          latest="${{ steps.versions.outputs.latest }}"
          python3 - <<'PY'
          from pathlib import Path
          import re

          latest = "${{ steps.versions.outputs.latest }}"

          Path("lean-toolchain").write_text(f"leanprover/lean4:{latest}\n", encoding="utf-8")

          lakefile = Path("lakefile.lean")
          text = lakefile.read_text(encoding="utf-8")
          text = re.sub(
              r'("https://github\.com/leanprover-community/mathlib4"\s+@\s+)"v\d+\.\d+\.\d+"',
              rf'\1"{latest}"',
              text,
              count=1,
          )
          lakefile.write_text(text, encoding="utf-8")
          PY

      - name: Set up Docker Buildx
        if: steps.versions.outputs.update_needed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build candidate Lean Docker image
        if: steps.versions.outputs.update_needed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean-build
          tags: lra-lean:update-candidate
          load: true
          cache-from: type=gha,scope=lra-lean-update-check
          cache-to: type=gha,scope=lra-lean-update-check,mode=max

      - name: Refresh Lake manifest
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            lake update

      - name: Check no Mathlib import in VolumeI / VolumeII
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            bash -lc 'if grep -rn "^import Mathlib" LRA/VolumeI/ LRA/VolumeII/ LRA/VolumeI.lean LRA/VolumeII.lean --include="*.lean"; then
              echo "ERROR: Mathlib import found in VolumeI/VolumeII (must be bare Lean 4)."
              exit 1
            fi
            echo "No Mathlib imports in VolumeI / VolumeII"'

      - name: Enforce Volume II namespace policy
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            bash -lc 'if grep -R -n -E "^namespace Peano([[:space:]]|$)|^open Peano([[:space:]]|$)|Peano\.[A-Za-z_]" LRA --include="*.lean"; then
              echo "ERROR: legacy Peano namespace declaration, open command, or qualified reference found."
              exit 1
            fi
            echo "All Peano-system and natural-number declarations use the LRA.VolumeII hierarchy."'

      - name: Check proof-readiness
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            python3 scripts/check-proof-readiness.py

      - name: Check Volume VII wiring
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            python3 scripts/check-volume-vii-wiring.py

      - name: Build active Lean libraries
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          rm -f lean-update-build.log
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            bash -lc 'lake build LRAVolumeI LRAVolumeII LRAVolumeIII LRAVolumeIV LRAVolumeVI LRAVolumeVII > /workspace/lean-update-build.log 2>&1 || {
              status=$?
              echo "Lean build failed. Final diagnostics:"
              tail -n 180 /workspace/lean-update-build.log
              exit $status
            }
            tail -n 40 /workspace/lean-update-build.log'

      - name: Build Lean test libraries
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          rm -f lean-update-test-build.log
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:update-candidate \
            bash -lc 'lake build LRATests > /workspace/lean-update-test-build.log 2>&1 || {
              status=$?
              echo "Lean test build failed. Final diagnostics:"
              tail -n 180 /workspace/lean-update-test-build.log
              exit $status
            }
            tail -n 40 /workspace/lean-update-test-build.log'

      - name: Upload update diagnostics
        if: failure() && steps.versions.outputs.update_needed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lean-update-diagnostics-${{ steps.versions.outputs.latest }}
          path: |
            lean-update-build.log
            lean-update-test-build.log
          if-no-files-found: ignore

      - name: Commit candidate update
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          git add lean-toolchain lakefile.lean lake-manifest.json
          if git diff --cached --quiet; then
            echo "No candidate changes to commit."
          else
            git commit -m "Check update to Lean ${{ steps.versions.outputs.latest }}"
          fi

      - name: Push candidate branch
        if: steps.versions.outputs.update_needed == 'true'
        run: |
          git push --force-with-lease origin "HEAD:${{ steps.versions.outputs.branch }}"

      - name: Create or update success issue
        if: steps.versions.outputs.update_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.versions.outputs.latest }}";
            const display = "${{ steps.versions.outputs.latest_display }}";
            const branch = "${{ steps.versions.outputs.branch }}";
            const notify = process.env.NOTIFY_HANDLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Bump Lean to ${version}`;
            const label = "lean-update";
            const branchUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/tree/${encodeURIComponent(branch)}`;
            const body = [
              `${notify ? `@${notify} ` : ""}The weekly Lean update check passed for Lean ${version}.`,
              "",
              `Candidate branch: [checking update to lean ${display}](${branchUrl})`,
              `Workflow run: ${runUrl}`,
              "",
              "The branch updates `lean-toolchain`, `lakefile.lean`, and `lake-manifest.json` and passed the Docker/Lake update check.",
            ].join("\n");

            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: label,
                color: "0e8a16",
                description: "Automated Lean version update checks",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
              per_page: 10,
            });

            const existing = issues.items.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: [label],
              });
            }

      - name: Notify failed update check
        if: failure() && steps.versions.outputs.update_needed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const version = "${{ steps.versions.outputs.latest }}";
            const pinned = "${{ steps.versions.outputs.pinned }}";
            const notify = process.env.NOTIFY_HANDLE;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `Lean ${version} update check failed`;
            const body = [
              `${notify ? `@${notify} ` : ""}The weekly Lean update check found ${version}, but the candidate update from ${pinned} did not complete successfully.`,
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Review the workflow diagnostics before bumping `lean-toolchain`, `lakefile.lean`, or `lake-manifest.json`.",
            ].join("\n");

            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "lean-update",
                color: "0e8a16",
                description: "Automated Lean version update checks",
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }

            const { data: issues } = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
              per_page: 10,
            });

            const existing = issues.items.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ["lean-update"],
              });
            }
