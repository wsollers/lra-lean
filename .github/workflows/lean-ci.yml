name: Lean Standardization Build

on:
  push:
    branches: [main, develop, standardization]
    paths:
      - 'LRA/**'
      - 'lakefile.lean'
  pull_request:
    branches: [main]
    paths:
      - 'LRA/**'
      - 'lakefile.lean'
      - 'Dockerfile'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'docker/lakefile.env.lean'
  workflow_dispatch:

concurrency:
  group: lean-standardization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Logic, Identity, Set, Relation, Function, and Operation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute immutable Lean environment image
        run: |
          env_hash="${{ hashFiles('Dockerfile', 'lean-toolchain', 'lake-manifest.json', 'docker/lakefile.env.lean') }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-lean-build:${env_hash}"
          echo "LEAN_ENV_HASH=$env_hash" >> "$GITHUB_ENV"
          echo "LEAN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull prebuilt Lean environment
        run: |
          docker pull "$LEAN_IMAGE" || {
            echo "::error::Prebuilt Lean environment $LEAN_IMAGE is missing. Publish it with the Publish Lean Environment Image workflow."
            exit 1
          }

      - name: Restore project Lean build cache
        uses: actions/cache@v4
        with:
          path: .ci-lake-build
          key: lra-project-${{ runner.os }}-${{ env.LEAN_ENV_HASH }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            lra-project-${{ runner.os }}-${{ env.LEAN_ENV_HASH }}-${{ github.ref_name }}-
            lra-project-${{ runner.os }}-${{ env.LEAN_ENV_HASH }}-

      - name: Build standardized foundational slice
        run: |
          mkdir -p .ci-lake-build .ci-logs
          rm -f .ci-logs/lean-standardization.log

          docker run --rm \
            -v "${{ github.workspace }}/LRA:/workspace/LRA:ro" \
            -v "${{ github.workspace }}/lakefile.lean:/workspace/lakefile.lean:ro" \
            -v "${{ github.workspace }}/lake-manifest.json:/workspace/lake-manifest.json:ro" \
            -v "${{ github.workspace }}/.ci-lake-build:/workspace/.lake/build" \
            -v "${{ github.workspace }}/.ci-logs:/logs" \
            -w /workspace \
            "$LEAN_IMAGE" \
            bash -lc 'rm -f .lake/lakefile.olean .lake/lakefile.olean.trace
              lake build \
                LRALogic \
                LRAIdentity \
                LRASetCore \
                LRAStandardizedFoundations \
                > /logs/lean-standardization.log 2>&1 || {
                  status=$?
                  echo "Lean standardized foundations build failed. Final diagnostics:"
                  tail -n 260 /logs/lean-standardization.log
                  exit $status
                }
                tail -n 100 /logs/lean-standardization.log'

      - name: Report proof placeholders in standardized subjects
        continue-on-error: true
        run: |
          if grep -rn "\bsorry\b" \
            LRA/Logic.lean \
            LRA/Identity.lean \
            LRA/Set.lean \
            LRA/Set/Interface/ \
            LRA/Set/SetClass/ \
            LRA/Set/PredicateSet/ \
            LRA/Set/ZFC/ \
            LRA/Set/ZFCSet/ \
            LRA/Set/Model/ \
            LRA/SetSystems/ \
            LRA/Relation.lean \
            LRA/Relation/ \
            LRA/Function.lean \
            LRA/Function/ \
            LRA/Operation.lean \
            LRA/Operation/ \
            --include="*.lean"; then
            echo "::warning::sorry found in the standardized foundational slice."
          else
            echo "No sorry in the standardized foundational slice"
          fi

      - name: Upload Lean build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: .ci-logs/lean-standardization.log
          if-no-files-found: warn
