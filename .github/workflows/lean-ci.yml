name: Lean Standardization Build

on:
  push:
    branches: [main, develop, standardization]
    paths:
      - 'LRA/**'
      - 'Dockerfile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LRA/**'
      - 'Dockerfile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean-ci.yml'
  workflow_dispatch:

concurrency:
  group: lean-standardization-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Logic, Identity, and Set core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute Lean image tag
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-lean-build:${{ hashFiles('Dockerfile', 'lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}"
          echo "LEAN_IMAGE=$image" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore Lean Docker image from GHCR
        id: lean-image
        run: |
          if docker pull "$LEAN_IMAGE"; then
            docker tag "$LEAN_IMAGE" lra-lean:latest
            echo "cache_hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "cache_hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.lean-image.outputs.cache_hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Lean Docker image
        if: steps.lean-image.outputs.cache_hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean-build
          tags: |
            lra-lean:latest
            ${{ env.LEAN_IMAGE }}
          load: true
          cache-from: type=gha,scope=lra-lean-lean-build
          cache-to: type=gha,scope=lra-lean-lean-build,mode=max

      - name: Store Lean Docker image in GHCR
        if: steps.lean-image.outputs.cache_hit != 'true' && github.event_name != 'pull_request'
        run: docker push "$LEAN_IMAGE"

      # The Mathlib import-policy check is intentionally disabled while the
      # file/folder standardization migration is in progress. The focused
      # build below gates only the canonical Logic -> Identity -> Set core
      # dependency slice. Concrete Set backends and Mathlib interop remain
      # opt-in and are migrated separately.

      - name: Build Logic, Identity, and Set core
        run: |
          rm -f lean-build.log
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:latest \
            bash -lc 'lake build LRALogic LRAIdentity LRASetCore > /workspace/lean-build.log 2>&1 || {
              status=$?
              echo "Lean build failed. Final diagnostics:"
              tail -n 180 /workspace/lean-build.log
              exit $status
            }
            tail -n 40 /workspace/lean-build.log'

      - name: Report proof placeholders in standardization core
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean:latest \
            bash -lc 'if grep -rn "\\bsorry\\b" \
              LRA/Logic.lean \
              LRA/Identity.lean \
              LRA/Set.lean \
              LRA/VolumeI/Logic/ \
              LRA/VolumeI/Identity/ \
              LRA/VolumeI/Set/Interface/ \
              --include="*.lean"; then
              echo "::warning::sorry found in the standardization core slice."
            else
              echo "No sorry in the standardization core slice"
            fi'

      - name: Upload Lean build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: lean-build.log
          if-no-files-found: error
