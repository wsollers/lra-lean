name: Lean Standardization Build

on:
  push:
    branches: [main, develop, standardization]
    paths:
      - 'LRA/**'
      - 'Dockerfile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'LRA/**'
      - 'Dockerfile'
      - 'lakefile.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - '.github/workflows/lean-ci.yml'
  workflow_dispatch:

jobs:
  build:
    name: Logic and Identity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Lean Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lean-build
          tags: lra-lean:latest
          load: true
          cache-from: type=gha,scope=lra-lean-lean-build
          cache-to: type=gha,scope=lra-lean-lean-build,mode=max

      # The Mathlib import-policy check is intentionally disabled while the
      # file/folder standardization migration is in progress. The focused
      # build below is the gate for the Logic -> Identity dependency slice.

      - name: Build Logic and Identity
        run: |
          rm -f lean-build.log
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean \
            bash -lc 'lake build LRALogic LRAIdentity > /workspace/lean-build.log 2>&1 || {
              status=$?
              echo "Lean build failed. Final diagnostics:"
              tail -n 180 /workspace/lean-build.log
              exit $status
            }
            tail -n 40 /workspace/lean-build.log'

      - name: Report proof placeholders in Logic and Identity
        continue-on-error: true
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            lra-lean \
            bash -lc 'if grep -rn "\bsorry\b" \
              LRA/Logic.lean \
              LRA/Identity.lean \
              LRA/VolumeI/Logic/ \
              LRA/VolumeI/Identity/ \
              --include="*.lean"; then
              echo "::warning::sorry found in the Logic/Identity migration slice."
            else
              echo "No sorry in the Logic/Identity migration slice"
            fi'

      - name: Upload Lean build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-build-diagnostics
          path: lean-build.log
          if-no-files-found: error
