name: One-shot PrimitiveIntervals field-summary cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-remove-primitive-field-summary.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove ad-hoc field summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          laws = Path('LRA/NumberSystems/RealNumbers/Constructions/PrimitiveIntervals/Laws.lean')
          text = laws.read_text()
          start_marker = '/-- Proposition expressing the Archimedean ordered-field laws.'
          end_marker = 'theorem ordered_field_structure : OrderedFieldStructure rational_model := by\n  sorry\n\n'
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          text = text.replace(
              '-- the reciprocal interval and its existence/uniqueness away from zero; the\n-- Archimedean ordered-field structure; and least-upper-bound completeness.',
              '-- the reciprocal interval and its existence/uniqueness away from zero; and\n-- least-upper-bound completeness.')
          laws.write_text(text)

          proof_order = Path('LRA/NumberSystems/RealNumbers/ProofOrder.md')
          p = proof_order.read_text()
          p = p.replace(
              'Also preserved verbatim: `ordered_field_structure`\'s self-referential\n`quotient_distributivity rational_model = quotient_distributivity\nrational_model` conjunct, and `canonical_comparison_isomorphism_exists`\'s\nself-comparison of `Carrier` to itself. These look like source bugs but\nare not this migration\'s to resolve.\n',
              'The earlier self-referential field-summary certificate and fake self-comparison\nhave been removed. Individual law theorems remain in `Laws.lean`; the\nauthoritative real-number certification is the carrier-tied\n`PrimitiveIntervalCarrierRealModelExists` theorem in `Instances.lean`.\n')
          p = p.replace(
              '      `IsReciprocalInterval`, `reciprocal_exists_uniquely`, `inverse`,\n      `OrderedFieldStructure`/`ordered_field_structure` (self-referential\n      conjunct preserved), `LeastUpperBoundProperty`/\n      `least_upper_bound_property` -- all `sorry` except raw defs.',
              '      `IsReciprocalInterval`, `reciprocal_exists_uniquely`, `inverse`,\n      `LeastUpperBoundProperty`/`least_upper_bound_property` -- all `sorry`\n      except raw defs. The former ad-hoc `OrderedFieldStructure` summary was\n      removed in favor of the canonical carrier-tied `RealModel` certificate.')
          proof_order.write_text(p)
          PY

          if git grep -n 'OrderedFieldStructure\|ordered_field_structure' -- LRA/NumberSystems/RealNumbers/Constructions/PrimitiveIntervals; then
            echo 'Stale PrimitiveIntervals field summary remains.' >&2
            exit 1
          fi

          rm .github/workflows/one-shot-remove-primitive-field-summary.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoondockTaints'
          git config user.email 'wsollers@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove PrimitiveIntervals field summary'
          git push origin HEAD:main
