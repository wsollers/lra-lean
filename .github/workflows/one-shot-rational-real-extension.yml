name: One-shot rational real extension migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-rational-real-extension.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tighten rational-specific real relationships
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          irr = Path('LRA/NumberSystems/RealNumbers/Irrationals.lean')
          text = irr.read_text()
          if 'import LRA.NumberSystems.RealNumbers.Definition' not in text:
              text = text.replace(
                  'import LRA.VolumeII.NumberSystems.Models\n',
                  'import LRA.NumberSystems.RealNumbers.Definition\nimport LRA.VolumeII.NumberSystems.Models\n',
                  1)
          text = text.replace(
              'CofinalRealExtension rational_system.FieldModel',
              'RationalRealExtension rational_system')
          irr.write_text(text)

          for name in [
              'LRA/NumberSystems/RealNumbers/ContinuedFractions/Definition.lean',
              'LRA/NumberSystems/RealNumbers/ContinuedFractions/Theorems.lean',
          ]:
              path = Path(name)
              text = path.read_text()
              text = text.replace(
                  'CofinalRealExtension rationalSystem.FieldModel',
                  'RationalRealExtension rationalSystem')
              path.write_text(text)

          router = Path('LRA/NumberSystems/RealNumbers.lean')
          text = router.read_text()
          if 'import LRA.NumberSystems.RealNumbers.Definition' not in text:
              text = 'import LRA.NumberSystems.RealNumbers.Definition\n' + text
          router.write_text(text)
          PY

          if git grep -n 'CofinalRealExtension rational_system.FieldModel' -- LRA/NumberSystems/RealNumbers/Irrationals.lean; then
            exit 1
          fi
          if git grep -n 'CofinalRealExtension rationalSystem.FieldModel' -- LRA/NumberSystems/RealNumbers/ContinuedFractions; then
            exit 1
          fi

          rm .github/workflows/one-shot-rational-real-extension.yml

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'BoondockTaints'
          git config user.email 'wsollers@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Require rational real extensions in rational theory'
          git push origin HEAD:main
