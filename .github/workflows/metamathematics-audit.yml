name: Temporary Metamathematics Audit

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Direct source audit
        shell: bash
        run: |
          set -u
          echo '=== LOGIC LEAN FILE COUNT ==='
          find LRA/Logic -type f -name '*.lean' | sort | tee /tmp/logic-files.txt | wc -l

          echo '=== SORRY COUNTS PER LOGIC FILE ==='
          total=0
          while IFS= read -r f; do
            n=$(grep -Eow '\bsorry\b' "$f" | wc -l || true)
            if [ "$n" -gt 0 ]; then
              printf '%4d %s\n' "$n" "$f"
              total=$((total+n))
            fi
          done < /tmp/logic-files.txt
          echo "TOTAL_SORRY=$total"

          echo '=== AXIOM DECLARATIONS UNDER LOGIC ==='
          grep -RnE '^[[:space:]]*axiom[[:space:]]' LRA/Logic --include='*.lean' || true

          echo '=== MATHLIB IMPORTS UNDER LOGIC ==='
          grep -RnE '^import[[:space:]]+Mathlib\.' LRA/Logic --include='*.lean' | sort || true

          echo '=== DECIDABLEEQ ASSUMPTIONS UNDER LOGIC ==='
          grep -RnF 'DecidableEq' LRA/Logic --include='*.lean' | sort || true

          echo '=== BARE SET REFERENCES IN SYNTAX OR LANGUAGE ==='
          grep -RnE '(^|[^A-Za-z0-9_.])Set([[:space:]]|\(|\{|$)' LRA/Logic/Syntax LRA/Logic/Language --include='*.lean' || true

          echo '=== ALL BARE SET REFERENCES UNDER LOGIC ==='
          grep -RnE '(^|[^A-Za-z0-9_.])Set([[:space:]]|\(|\{|$)' LRA/Logic --include='*.lean' || true

          echo '=== PROP-VALUED ARROWS IN SYNTAX OR LANGUAGE ==='
          grep -RnE '→[[:space:]]*Prop|->[[:space:]]*Prop' LRA/Logic/Syntax LRA/Logic/Language --include='*.lean' || true

  isolated-lean-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute Lean environment image
        run: |
          env_hash="${{ hashFiles('Dockerfile', 'lean-toolchain', 'lake-manifest.json', 'docker/lakefile.env.lean') }}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}-lean-build:${env_hash}"
          echo "LEAN_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull Lean environment
        run: docker pull "$LEAN_IMAGE"
      - name: Compile Logic metamathematics boundary directly
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/LRA:/workspace/LRA:ro" \
            -v "${{ github.workspace }}/lakefile.lean:/workspace/lakefile.lean:ro" \
            -v "${{ github.workspace }}/lake-manifest.json:/workspace/lake-manifest.json:ro" \
            -w /workspace \
            "$LEAN_IMAGE" \
            bash -lc 'lake env lean LRA/Logic/Metamathematics.lean'
